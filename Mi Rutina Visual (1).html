<style>

:root[data-theme="dark"]{--bg:#1B2430;--surf:#26323F;--ink:#E8EEF4;--mute:#9AABBC;--line:#3A4858;--acc:#7FA8DB;--accT:#0F2036;--ok:#7DB898;--okT:#0F2E22;--sun:#E6C877;--lil:#3B3556;--dng:#5A3434;--dngT:#F5DADA;--floor:#4A4660}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.app.wp{padding-bottom:130px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:800;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.done::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--okT);color:#fff;font-size:12px;display:grid;place-items:center}
.dot.now{border:3px solid var(--acc);background:var(--lil)}
.card{background:var(--surf);border-radius:28px;border:2px solid var(--line);padding:22px 16px;text-align:center}
.lbl{font-size:16px;color:var(--mute)}
.pic{width:190px;height:190px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:104px;animation:br 4s ease-in-out infinite}
.calm .pic{animation:none}@keyframes br{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pic{animation:none}}
.name{font-size:30px;font-weight:800;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--lil);border-radius:12px;padding:3px 10px;font-size:14px;margin-top:6px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:12px 6px 0}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width 1s linear}
.next{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:20px;border:2px solid var(--line);padding:10px 14px}.next .e{font-size:32px}
.big{width:100%;padding:20px;border-radius:24px;background:var(--ok);color:var(--okT);font-size:24px;font-weight:800}.big:active{transform:scale(.98)}
.ghost{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px}
.prim{background:var(--acc);color:var(--accT);border-radius:14px;padding:11px 16px;font-weight:800}
.dng{background:var(--dng);color:var(--dngT);border-radius:14px;padding:10px 14px;font-weight:800}
.reward{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,55,75,.35);z-index:30}
.reward div{background:var(--surf);border-radius:32px;padding:28px 34px;text-align:center;font-size:26px;font-weight:800;animation:pop .5s ease-out;max-width:90%}.calm .reward div{animation:none}
.reward .s{font-size:80px;display:block}@keyframes pop{from{transform:scale(.7);opacity:0}}
.reward .cn{display:inline-block;margin-top:10px;background:var(--sun);color:#3A3320;border-radius:18px;padding:6px 18px;font-size:30px}
.stars{font-size:26px;letter-spacing:4px;word-break:break-all}
h2{margin:8px 0 0;font-size:18px}.hint{font-size:13px;color:var(--mute);margin:0}
.panel{background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--bg)}
.row .e{font-size:26px}.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.sm{background:var(--surf);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;flex:0 0 auto}
input[type=text],input[type=time],input[type=number],textarea{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 10px;width:100%}
input[type=time]{width:112px;flex:0 0 auto;padding:6px}textarea{min-height:90px;resize:vertical;font-size:13px}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lib button{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow-wrap:anywhere}.lib .e{font-size:28px}
.lib button b{font-size:12px}
.lib button.on{border-color:var(--ok);background:var(--lil)}
.lib button.off{opacity:.55}
.lib .mini{width:56px;height:56px;display:block}
.lib.l3{grid-template-columns:repeat(3,1fr)}
.lib.pick{grid-template-columns:repeat(8,1fr)}.lib.pick button{font-size:22px;padding:6px 0}
.sw{display:flex;gap:8px}.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.sw button[aria-pressed=true]{border-color:var(--ink)}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;font-size:14px}.two{display:flex;gap:8px}
.modal{position:fixed;inset:0;background:rgba(40,55,75,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.prev{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px;margin:0 auto}
.home{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:28px}.home h1{margin:0;font-size:34px;font-weight:800}.home p{margin:0}.trail{font-size:32px;letter-spacing:6px}.cg{background:var(--lil);color:var(--ink);font-size:20px;padding:16px}.pt{background:var(--sun);color:#3A3320;font-size:20px;padding:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.home .chip{margin:0}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:50%}.note{background:var(--sun);border-color:var(--sun);color:#3A3320}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:12px}.tile b{display:block;font-size:26px}.bars{display:flex;gap:6px;align-items:flex-end;height:150px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:12px}.bv{width:100%;background:var(--acc);border-radius:8px 8px 0 0;min-height:3px}
.hide{display:none!important}
.msg{font-size:14px;color:var(--okT);background:var(--ok);border-radius:12px;padding:8px 12px}

/* ===== Monedas ===== */
.coins{background:var(--sun);color:#3A3320;border-radius:14px;padding:7px 14px;font-weight:800;font-size:16px}
.coins.bump{animation:bump .6s ease-out}@keyframes bump{40%{transform:scale(1.25)}}

/* ===== Mascota dibujada (SVG) ===== */
.pet{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
.pet .all{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
.pet .tail{transform-origin:214px 240px;animation:wag 1.1s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.pet .earL{transform-origin:105px 90px;animation:twl 7s infinite}
.pet .earR{transform-origin:195px 90px;animation:twr 7s infinite 1.5s}
@keyframes twl{0%,90%,100%{transform:none}94%{transform:rotate(-7deg)}}
@keyframes twr{0%,90%,100%{transform:none}94%{transform:rotate(7deg)}}
.pet .eyeo{transform-origin:0 122px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.pet .wl{transform-origin:104px 172px;animation:fl1 1.6s ease-in-out infinite}
.pet .wr{transform-origin:196px 172px;animation:fl2 1.6s ease-in-out infinite}
@keyframes fl1{50%{transform:rotate(-10deg)}}@keyframes fl2{50%{transform:rotate(10deg)}}
.pet .armL{transform-origin:92px 190px}.pet .armR{transform-origin:208px 190px}
.pet.cheer .armL{animation:wvl .45s ease-in-out 4}.pet.cheer .armR{animation:wvr .45s ease-in-out 4}
@keyframes wvl{50%{transform:rotate(38deg)}}@keyframes wvr{50%{transform:rotate(-38deg)}}
.pet.jump .all{animation:jmp2 .7s ease-out}
@keyframes jmp2{30%{transform:translateY(-34px) scale(1.04,.98)}60%{transform:translateY(0) scale(1.04,.96)}}
.pet.shake .all{animation:shk .18s linear 8}
@keyframes shk{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.pet.wig .all{animation:wg2 .22s linear infinite}
@keyframes wg2{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.pet .head-g{transform-origin:150px 170px}
.pet.chew .head-g{animation:chw .23s ease-in-out}
@keyframes chw{50%{transform:translateY(5px) scale(1.02,.97)}}
.pet .mm,.pet .eyeh,.pet .eyez{display:none}
.pet[data-m=smile] .m-smile,.pet[data-m=sad] .m-sad,.pet[data-m=open] .m-open{display:inline}
.pet[data-e=h] .eyeo,.pet[data-e=z] .eyeo{display:none}
.pet[data-e=h] .eyeh,.pet[data-e=z] .eyez{display:inline}
.pet .fb{animation:fbo 1.8s ease-out forwards}
@keyframes fbo{to{opacity:0}}
.calm .pet *,.pet.still *,.pet.still{animation:none!important}
@media (prefers-reduced-motion:reduce){.pet *{animation:none!important}}
.stagecard{padding:12px 12px 16px}
.stage2{position:relative;max-width:340px;margin:0 auto;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,var(--lil) 0,var(--lil) 68%,var(--floor) 68%,var(--floor) 100%);padding:46px 18px 8px;user-select:none;-webkit-user-select:none}
.stage2.bathing .pet{touch-action:none}
.msg2{position:absolute;left:10px;top:10px;max-width:62%;background:var(--surf);border-radius:14px;padding:6px 10px;font-size:14px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:4}
.think{position:absolute;right:12px;top:10px;width:58px;height:58px;border-radius:50%;background:var(--surf);border:3px solid var(--acc);font-size:30px;display:grid;place-items:center;z-index:4;animation:fl 2.4s ease-in-out infinite}
.calm .think{animation:none}
.fxl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pt2{position:absolute;pointer-events:none;font-size:28px;transform:translate(-50%,-50%);opacity:0}
.pt2.pup{animation:pup 1.6s ease-out forwards}
.pt2.pdn{animation:pdn .9s ease-in forwards}
.pt2.show{animation:shw 2.6s ease-in-out forwards;font-size:46px}
.pt2.sweep{font-size:46px;animation:swp 2.4s ease-in-out forwards}
@keyframes pup{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-220%)}}
@keyframes pdn{from{opacity:.9;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,230%)}}
@keyframes shw{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
@keyframes swp{0%{opacity:1;left:22%}25%{left:78%}50%{left:22%}75%{left:78%}100%{opacity:0;left:50%}}
.ghost-food{position:fixed;transform:translate(-50%,-50%);font-size:60px;pointer-events:none;z-index:60;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.food-btn{touch-action:none;user-select:none;-webkit-user-select:none}
.sponge{position:fixed;font-size:46px;transform:translate(-50%,-50%) rotate(-15deg);pointer-events:none;z-index:60}
.bathbar{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;align-items:center;background:var(--surf);border-radius:14px;padding:6px 8px;font-size:13px;z-index:6}
.bathbar .tr{flex:1;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bathbar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.nightv{position:absolute;inset:0;background:rgba(20,25,60,.6);display:flex;flex-direction:column;justify-content:space-between;align-items:center;color:#fff;font-size:14px;padding:12px;pointer-events:none;z-index:3}
.nightv .moon{font-size:44px;align-self:flex-start}
.pname{text-align:center;font-weight:800;font-size:20px;max-width:240px;margin:12px auto 0;display:block}
.sbars{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
.sbar{display:flex;align-items:center;gap:8px;font-size:14px}
.sbar .tr{flex:1;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:8px;transition:width .6s}

/* mascota flotante */
#fpet{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.fp{width:100%;max-width:430px;padding:0 16px;display:flex;align-items:flex-end;justify-content:flex-end;gap:10px}
.fp>*{pointer-events:auto}
.fpb{background:transparent;border:0;width:96px;height:96px;flex:0 0 auto;padding:0;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22));animation:fl 3s ease-in-out infinite}

.fpb.jump{animation:jmp .8s ease-out}
@keyframes jmp{30%{transform:translateY(-30px) scale(1.12)}60%{transform:translateY(0) scale(.95)}}
.fpb.wig{animation:wg .8s ease-in-out 2}
@keyframes wg{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.calm .fpb,.calm .fpb.jump,.calm .fpb.wig{animation:none}

.bub{position:relative;background:var(--surf);border:2px solid var(--acc);border-radius:18px;padding:10px 12px;font-size:15px;max-width:230px;margin-bottom:22px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.bub::after{content:"";position:absolute;right:-8px;bottom:14px;width:12px;height:12px;background:var(--surf);border-right:2px solid var(--acc);border-top:2px solid var(--acc);transform:rotate(45deg)}

function fixPet(){const P=S.pet=Object.assign(def().pet,S.pet);if(!P.own||typeof P.own!=='object')P.own={};if(!P.own.perro&&!Object.keys(P.own).length)P.own.perro=newPet('Perrito');if(!P.own[P.cur])P.cur=Object.keys(P.own)[0]||'perro';if(!P.own[P.cur])P.own[P.cur]=newPet('Perrito');if(!Array.isArray(P.items))P.items=[];
 Object.values(P.own).forEach(p=>{p.wear=Object.assign({hat:'',eyes:'',neck:''},p.wear);['f','c','m'].forEach(k=>{if(typeof p[k]!=='number')p[k]=80});if(!p.t)p.t=Date.now()})}
const cp=()=>S.pet.own[S.pet.cur];
const sadNow=()=>{const p=cp();return(p.f+p.c+p.m)/3<50};
function tick(){const now=Date.now();Object.values(S.pet.own).forEach(p=>{const h=(now-p.t)/3600000,d=Math.floor(h*6);if(d>0){p.f=Math.max(20,p.f-d);p.c=Math.max(20,p.c-Math.round(d*.7));p.m=Math.max(20,p.m-Math.round(d*.8));p.t=now}})}
function newDay(){const t=today();if(S.idxDay!==t){S.idx={};S.idxDay=t}if(!S.paid||S.paid.d!==t)S.paid={d:t,r:{}}}
function say(m,ms){if(!S.pet.on)return;bub=m;clearTimeout(bt);bt=setTimeout(()=>{bub='';const x=$('bub');if(x)x.classList.add('hide')},ms||6500);const b=$('bub');if(b){b.textContent=m;b.classList.remove('hide')}
 const sv=document.querySelector('.fpb .pet');if(sv){sv.setAttribute('data-m','open');setTimeout(()=>sv.setAttribute('data-m',sadNow()?'sad':'smile'),900)}
 if(S.pet.voice&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(m.replace(/[^\p{L}\p{N}\s.,¡!¿?]/gu,''));u.lang='es';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}}

function modal(){
 if(!D){$("layer").innerHTML="";return}
 $("layer").innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-label="Actividad"><div class="prev" id="pv" style="background:${COL[D.c]}">${esc(D.e)}</div>
 <label class="f">Nombre<input type="text" data-d="n" value="${esc(D.n)}" maxlength="24"></label>
 <label class="f">Icono (elige o escribe un emoji)<input type="text" data-d="e" value="${esc(D.e)}" maxlength="8"></label>
 <div class="lib pick">${EM.map(x=>`<button data-a="pick" data-v="${x}">${x}</button>`).join("")}</div>
 <div class="f">Color<div class="sw">${COL.map((c,i)=>`<button data-a="col" data-i="${i}" style="background:${c}" aria-label="Color ${i+1}" aria-pressed="${D.c===i}"></button>`).join("")}</div></div>
 <label class="f">Temporizador visual en minutos (0 = sin temporizador)<input type="number" data-d="min" value="${D.min}" min="0" max="120"></label>
 <div class='f'>Foto real (opcional)<div class='two' style='align-items:center'>${D.p?`<img src='${D.p}' alt='' style='width:44px;height:44px;border-radius:50%;object-fit:cover'>`:''}<label class='ghost' style='flex:1;text-align:center'>📷 ${D.p?'Cambiar foto':'Elegir foto'}<input type='file' accept='image/*' id='ph' hidden></label>${D.p?`<button class='ghost' data-a='nophoto'>Quitar</button>`:''}</div></div>
 <label class='f'>Frase para leer en voz alta<input type='text' data-d='s' value='${esc(D.s)}' maxlength='80' placeholder='Es hora de lavarnos los dientes'></label>
 <div class='f'>Tu voz (opcional)<div class='two'><button class='ghost' data-a='rec' id='rb'>🎙 Grabar</button>${D.v?`<button class='ghost' data-a='play2'>▶ Escuchar</button><button class='ghost' data-a='novoice'>Quitar</button>`:''}</div></div>
 <div class="two"><button class="prim" data-a="saveact" style="flex:1">Guardar</button><button class="ghost" data-a="closem">Cancelar</button></div>
 ${D.id?`<button class="${armed==="a"?"dng":"ghost"}" data-a="delact">${armed==="a"?"Toca otra vez para eliminar":"Eliminar actividad"}</button>`:""}</div></div>`;

const VIEWS={care,home,rep,pets};
function go(v){endModes();view=v;flash="";armed=null;pm='';newDay();clearInterval(tm);clearInterval(nt);if(v==='child')greet=true;render();window.scrollTo(0,0)}
function render(){tick();(VIEWS[view]||child)();modal();fpet();$('app').classList.toggle('wp',view==='child'&&S.pet.on);document.body.classList.toggle("calm",S.calm)}
function reward(c){const m=S.rewards.filter(Boolean);const d=document.createElement("div");d.className="reward";d.innerHTML=`<div><span class="s">⭐</span>${esc(m[Math.floor(Math.random()*m.length)]||"¡Muy bien!")}${c?`<span class="cn">+${c} 🪙</span>`:''}</div>`;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),S.calm?1200:1900)}
const A={
 tab(b){S.cur=b.dataset.id;armed=null;save();render()},
 back(){go("child")},
 care(){go("care")},
 home(){go("home")},
 child(){go("child")},
 pets(){go("pets")},
 done(){newDay();const r=R(),i0=idx(),s0=r.steps[i0];if(!s0)return;
  const last=i0+1>=r.steps.length,fresh=!S.paid.r[r.id];let c=0;
  if(fresh){c=S.pet.earn+(last?S.pet.bonus:0);if(last)S.paid.r[r.id]=1}
  S.coins+=c;
  S.log.push({d:today(),r:r.n,a:S.acts[s0.a].n,f:last?1:0});if(S.log.length>3000)S.log.shift();
  S.idx[r.id]=i0+1;S.stars++;save();reward(c);render();
  const nx=r.steps[i0+1];
  say(`${c?'+'+c+' 🪙 ':''}¡Bien hecho!${nx?` Ahora toca: ${S.acts[nx.a].e} ${S.acts[nx.a].n}. ¡Tú puedes!`:' ¡Terminaste tu rutina! 🎉'}`,7500);petAnim('jump');
  if(c){const x=$('cn');if(x&&!S.calm)x.classList.add('bump')}},
 again(){S.idx[R().id]=0;save();greet=true;render()},
 up(b){const s=R().steps,n=+b.dataset.n;if(n>0)[s[n-1],s[n]]=[s[n],s[n-1]];save();render()},
 dn(b){const s=R().steps,n=+b.dataset.n;if(n<s.length-1)[s[n+1],s[n]]=[s[n],s[n+1]];save();render()},
 rm(b){R().steps.splice(+b.dataset.n,1);save();render()},
 add(b){R().steps.push({a:b.dataset.id,t:""});save();render()},
 newr(){const r={id:uid(),n:"Nueva rutina",e:"⭐",steps:[]};S.routines.push(r);S.cur=r.id;save();render()},
 delr(){
  if(armed!=="r"){armed="r";return render()}armed=null;S.routines=S.routines.filter(r=>r.id!==S.cur);S.cur=S.routines.length?S.routines[0].id:'';flash='Rutina eliminada.';save();render()},
 newa(){D={id:null,e:'⭐',n:'',c:0,min:0,p:'',v:'',s:''};armed=null;modal()},
 edit(b){const a=S.acts[b.dataset.id];D={id:b.dataset.id,e:a.e,n:a.n,c:a.c,min:a.min,p:a.p||'',v:a.v||'',s:a.s||''};armed=null;modal()},
 pick(b){D.e=b.dataset.v;document.querySelector('[data-d="e"]').value=D.e;$("pv").textContent=D.e},
 col(b){D.c=+b.dataset.i;modal()},
 closem(){D=null;armed=null;modal()},
 saveact(){D.n=D.n.trim();if(!D.n){flash="";document.querySelector('[data-d="n"]').focus();return}
  const id=D.id||"u"+uid();S.acts[id]={e:D.e||'⭐',n:D.n,c:D.c,min:Math.max(0,Math.min(120,+D.min||0)),p:D.p,v:D.v,s:(D.s||'').trim()};D=null;save();flash="Actividad guardada.";render()},
 delact(){if(armed!=="a"){armed="a";return modal()}
  const id=D.id;delete S.acts[id];S.routines.forEach(r=>r.steps=r.steps.filter(s=>s.a!==id));D=null;armed=null;save();flash="Actividad eliminada.";render()},
 rep(){go('rep')},
 seen(){S.chg.s=today();save();render()},
 pubchg(){if(!S.chg.t){flash='Escribe qué cambia hoy.';return render()}S.chg.d=today();S.chg.s='';save();flash='Aviso publicado para hoy.';render()},
 clrchg(){S.chg={e:'📅',t:'',d:'',s:''};save();flash='Aviso quitado.';render()},
 say(){const s=R().steps[idx()];if(!s)return;const a=S.acts[s.a];if(a.v){new Audio(a.v).play().catch(()=>{});return}if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(a.s||a.n);u.lang='es';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}},
 nophoto(){D.p='';modal()},novoice(){D.v='';modal()},play2(){new Audio(D.v).play().catch(()=>{})},
 async rec(){if(mr&&mr.state==='recording'){mr.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];mr=new MediaRecorder(st);
   mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const fr=new FileReader();fr.onload=()=>{D.v=fr.result;modal()};fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
   mr.start();$('rb').textContent='⏹ Detener';setTimeout(()=>{if(mr.state==='recording')mr.stop()},8000)}
  catch(e){$('rb').textContent='Micrófono no disponible'}},
 demo(){const L=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);S.routines.forEach((r,j)=>{const n=Math.min(r.steps.length,Math.max(0,r.steps.length-((i*3+j*2)%4)));for(let k=0;k<n;k++)L.push({d:key(d),r:r.n,a:S.acts[r.steps[k].a].n,f:k===r.steps.length-1?1:0,s:1})})}
  S.log=S.log.filter(x=>!x.s).concat(L);save();flash='Datos de ejemplo cargados.';render()},
 sum(){const q=stats();const t=`Mi Rutina Visual, resumen de 7 días${S.name?' de '+S.name:''}: ${q.w.length} pasos completados, ${q.fin} rutinas terminadas, ${q.ad} de 7 días con actividad.${q.top.length?' Más frecuentes: '+q.top.map(x=>x[0]+' ('+x[1]+')').join(', ')+'.':''}`;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>{flash='Resumen copiado.';render()}).catch(()=>{flash=t;render()})}else{flash=t;render()}},
 dellog(){if(armed!=='l'){armed='l';return render()}armed=null;S.log=[];save();flash='Historial borrado.';render()},
 addpack(b){const p=PACKS[+b.dataset.i],steps=p[3].map(s=>{const q=s.split('|'),id=q[0];if(!S.acts[id])S.acts[id]=q.length>1?{e:q[1],n:q[2],c:(id.length*3+q[2].length)%6,min:0}:def().acts[id];return{a:id,t:''}});
  const r={id:uid(),n:p[1],e:p[0],steps};S.routines.push(r);S.cur=r.id;save();flash='Rutina «'+p[1]+'» agregada. Está al final de tus rutinas y ya puedes editarla.';render();window.scrollTo(0,0)},
 calm(){S.calm=!S.calm;save();render()},
 reset(){S.idx={};S.stars=0;save();render()},
 copy(){const t=$("bk");t.select();try{navigator.clipboard.writeText(t.value);flash="Texto copiado."}catch(e){flash="Selecciona el texto y cópialo."}render()},
 imp(){try{const p=JSON.parse($("bk").value);if(!p.acts||!Array.isArray(p.routines))throw 0;S=Object.assign(def(),p);fixPet();S.cur=S.routines.length?S.routines[0].id:'';save();flash="Datos restaurados."}catch(e){flash="Ese texto no parece una copia válida. Pega el texto completo y vuelve a intentar."}render()},

 /* ----- mascota ----- */
 ptab(b){if(lock())return;S.ptab=b.dataset.v;pm='';save();render()},
 bathstart(){if(!free())return;const x=BATH[0],p=cp();
  if(p.c>=95){pmsg('Ya estoy limpiecita ✨');return}
  if(S.coins<x[2]){pmsg(poor());return}
  S.coins-=x[2];save();hud();startBath()},
 bathend(){finishBath()},
 shower(){if(!free())return;const x=BATH[1],p=cp();
  if(p.c>=95){pmsg('Ya estoy limpiecita ✨');return}
  if(S.coins<x[2]){pmsg(poor());return}
  S.coins-=x[2];save();hud();rinse(Math.min(100,p.c+x[3]))},
 brush(){if(!free())return;const x=BATH[2],p=cp();
  if(p.c>=95){pmsg('Ya estoy peinadita 💖');return}
  if(S.coins<x[2]){pmsg(poor());return}
  S.coins-=x[2];save();hud();busy=true;setE('h');pmsg('¡Qué cosquillitas! 🪮');
  const f=$('fxl'),H=f.clientHeight,b=document.createElement('span');b.className='pt2 sweep';b.textContent='🪮';b.style.top=H*.5+'px';f.appendChild(b);
  const iv=setInterval(()=>burst(['✨']),400);
  setTimeout(()=>{clearInterval(iv);b.remove();p.c=Math.min(100,p.c+x[3]);p.m=Math.min(100,p.m+5);save();hud();setE('o');pmsg('¡Quedé suavecita! ✨');busy=false;render()},2500)},
 playball(){if(!free())return;busy=true;const p=cp();pmsg('¡La pelota! ⚽');
  const f=$('fxl'),W=f.clientWidth,H=f.clientHeight,ball=document.createElement('span');ball.className='pt2';ball.style.opacity=1;ball.style.fontSize='38px';ball.textContent='⚽';f.appendChild(ball);
  const t0=performance.now();let lastHop=0;
  const end=()=>{p.m=Math.min(100,p.m+25);save();hud();setLook(0,0);cls('jump',700);cls('cheer',1800);setE('h');burst(['❤️','⭐','❤️']);pmsg('¡Qué divertido! ⚽');setTimeout(()=>{setE('o');busy=false;render()},1400)};
  const step=now=>{const t=(now-t0)/1000;if(now-t0>=5000||view!=='pets'||!$('fxl')){ball.remove();if(view==='pets'&&$('fxl'))end();else busy=false;return}
   const x=W*(.5+.36*Math.sin(t*2.4)),y=H*.78-Math.abs(Math.sin(t*5.5))*H*.34;ball.style.left=x+'px';ball.style.top=y+'px';
   setLook(clamp((x-W/2)/(W*.3)),-.2);
   if(Math.abs(x-W/2)<W*.07&&now-lastHop>900){lastHop=now;cls('jump',700)}
   requestAnimationFrame(step)};
  requestAnimationFrame(step)},
 sleep(){if(lock())return;if(mode==='sleep'){wake();return}mode='sleep';sleptAt=Date.now();pmsg('Zzz… buenas noches 🌙');render();startZ()},
 wear(b){if(lock())return;const w=WEAR[+b.dataset.i],p=cp();
  if(!S.pet.items.includes(w[1])){if(S.coins<w[3]){pm=poor();return render()}S.coins-=w[3];S.pet.items.push(w[1]);p.wear[w[0]]=w[1];pm='¡Qué lindo me veo! 😍'}
  else{p.wear[w[0]]=p.wear[w[0]]===w[1]?'':w[1];pm=p.wear[w[0]]?'¡Me encanta!':'Listo'}
  save();render();cls('cheer',1500);burst(['✨','✨'])},
 petpick(b){if(lock())return;const id=b.dataset.id,x=PETS.find(y=>y[0]===id);if(!x)return;
  if(S.pet.own[id]){S.pet.cur=id;pm=`¡Hola! Soy ${S.pet.own[id].n}`}
  else{if(S.coins<x[3]){pm=poor();return render()}S.coins-=x[3];S.pet.own[id]=newPet(x[2]);S.pet.cur=id;pm='¡Tengo un nuevo amigo! 🎉'}
  save();render();cls('jump',700);burst(['🎉','✨','⭐'])},
 fpt(){S.pet.on=!S.pet.on;save();render()},
 pvt(){S.pet.voice=!S.pet.voice;save();render()},
 gift(){S.coins+=10;save();flash='Se regalaron 10 monedas.';render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.d){D[t.dataset.d]=t.value;if(t.dataset.d==="e")$("pv").textContent=t.value}});
document.addEventListener("change",e=>{const t=e.target,f=t.dataset.f;if(!f)return;const r=R();
 if(f==="rn")r.n=t.value.trim()||"Rutina";if(f==="re")r.e=t.value.trim()||"⭐";if(f==="st")r.steps[+t.dataset.n].t=t.value;
 if(f==="name")S.name=t.value.trim();if(f==="rw")S.rewards=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(f==='ce')S.chg.e=t.value.trim()||'📅';if(f==='ct')S.chg.t=t.value.trim();
 if(f==='earn')S.pet.earn=Math.max(0,Math.min(50,Math.floor(+t.value)||0));
 if(f==='bonus')S.pet.bonus=Math.max(0,Math.min(50,Math.floor(+t.value)||0));
 if(f==='pn')cp().n=t.value.trim()||'Mi mascota';
 if(!S.rewards.length)S.rewards=["¡Muy bien!"];save();if(f==="rn"||f==="re")render()});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='ph'||!t.files[0])return;const u=URL.createObjectURL(t.files[0]),img=new Image();
 img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(img.width,img.height);c.width=c.height=360;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,360,360);D.p=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(u);modal()};img.src=u});
fixPet();newDay();save();
render();
